name: Auto Special Benefit QA
on:
  push:
    branches:
      - fix/auto-special-benefit-arrear
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  logic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module <<'NODE'
          import {specialBenefit2025,incremented2015Basic,PAY2015} from './src/rules.js';
          const a=specialBenefit2025(9,20000);
          if(a.rate!==0.10||a.monthly!==2000) throw new Error('grade 1-9 special benefit failed');
          const b=specialBenefit2025(10,20000);
          if(b.rate!==0.15||b.monthly!==3000) throw new Error('grade 10-20 special benefit failed');
          const c=specialBenefit2025(20,5000);
          if(c.monthly!==1500) throw new Error('minimum special benefit failed');
          const g='10', first=PAY2015[g][0], next=incremented2015Basic(g,first,1);
          if(!(next>=first)) throw new Error('2015 increment failed');
          console.log({a,b,c,first,next});
          NODE
          grep -q "specialBenefitThreeMonths=specialBenefitMonthly\*3" src/main.jsx
          grep -q "priorNetAfterSpecial=Math.max(0,priorThreeNetArrear-specialBenefitThreeMonths)" src/main.jsx
          grep -q "octoberBillNet:october.net+priorNetAfterSpecial" src/main.jsx
          ! grep -q "specialBenefitPaid" src/main.jsx

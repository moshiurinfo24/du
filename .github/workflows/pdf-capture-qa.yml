name: PDF Capture QA
on:
  push:
    branches:
      - fix/real-pdf-capture-three-pages
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify three-page PDF renderer
        working-directory: .
        run: |
          grep -q "z-index:2147483646" frontend/src/main.jsx
          grep -q "No PDF pages were generated" frontend/src/main.jsx
          grep -q "salaryCombinedReportHtml" frontend/src/main.jsx
          ! grep -q "z-index:-2147483647" frontend/src/main.jsx

name: Premium PDF QA
on:
  push:
    branches:
      - feature/premium-all-pdf-reports
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q "function pdfSummaryCards" frontend/src/main.jsx
          grep -q "function pdfTable" frontend/src/main.jsx
          grep -q "scale:2.6" frontend/src/main.jsx
          grep -q "0.985" frontend/src/main.jsx
          grep -q "Premium A4" frontend/src/main.jsx
          grep -q "Promotion Career Roadmap" frontend/src/main.jsx
          grep -q "অক্টোবর ২০২৬ চূড়ান্ত আনুমানিক হিসাব" frontend/src/main.jsx
          grep -q "চূড়ান্ত বাসা বরাদ্দ পয়েন্ট" frontend/src/main.jsx
          grep -q "@page{size:A4 portrait" frontend/src/final-core-phase16-19.css

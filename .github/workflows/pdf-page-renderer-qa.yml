name: PDF Page Renderer QA
on:
  push:
    branches:
      - fix/pdf-page-by-page-renderer
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify page renderer source
        working-directory: .
        run: |
          grep -q "html2canvas(page" frontend/src/main.jsx
          grep -q "pdf.addPage('a4','portrait')" frontend/src/main.jsx
          grep -q "pdf.addImage(img,'JPEG',8,6,194,285" frontend/src/main.jsx
          grep -q "salaryCombinedReportHtml" frontend/src/main.jsx

name: Premium PDF V2 QA
on:
  push:
    branches:
      - fix/premium-pdf-readability-v2
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q "colgroup" frontend/src/main.jsx
          grep -q "overflow-wrap:anywhere" frontend/src/main.jsx
          grep -q "box-sizing:border-box;white-space:normal" frontend/src/main.jsx
          grep -q "pdf-table-wrap" frontend/src/main.jsx
          grep -q "premium-pdf-page,.premium-pdf-page \*" frontend/src/main.jsx
          grep -q "salaryOctoberArrearReportHtml" frontend/src/main.jsx
          grep -q "promotionReportHtml" frontend/src/main.jsx
          grep -q "houseAllocationReportHtml" frontend/src/main.jsx
          grep -q "salaryCombinedReportHtml" frontend/src/main.jsx

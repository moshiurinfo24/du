name: Generate npm lockfiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate package-lock files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate worker lockfile
        working-directory: worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json worker/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "build: lock npm dependencies [skip ci]"
          git push

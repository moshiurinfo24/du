name: Public Visitor Stats QA
on:
  push:
    branches:
      - feature/public-live-visitor-stats
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q "/api/public/track" worker/src/index.js
          grep -q "/api/public/stats" worker/src/index.js
          grep -q "public-live-stats" frontend/src/main.jsx
          grep -q "public_events" database/017_public_visitor_stats.sql

name: PDF Render Fix QA
on:
  push:
    branches:
      - fix/pdf-render-and-du-label
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify PDF and label changes
        working-directory: .
        run: |
          grep -q "data-pdf-stage" frontend/src/main.jsx
          grep -q "সাবমিট করুন" frontend/src/main.jsx
          grep -q "du-deduction-summary simple" frontend/src/main.jsx
          ! grep -q "সরকারি নিয়মে হিসাব করুন" frontend/src/main.jsx

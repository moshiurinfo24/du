name: October Arrear QA
on:
  push:
    branches:
      - fix/october-2026-arrear
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q "arrear2026" frontend/src/main.jsx
          grep -q "priorThreeBasicArrear" frontend/src/main.jsx
          grep -q "totalBasicArrear:monthlyBasicArrear\*4" frontend/src/main.jsx
          grep -q "octoberBillNet:october.net+priorArrearAfterAdjustment" frontend/src/main.jsx
          grep -q "অক্টোবর ২০২৬ বিলের সাথে জুলাই–সেপ্টেম্বরের বকেয়া" frontend/src/main.jsx
          grep -q "salaryOctoberArrearReportHtml" frontend/src/main.jsx
          grep -q "october-arrear.css" frontend/src/main.jsx

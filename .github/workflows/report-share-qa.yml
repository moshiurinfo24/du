name: Report Share QA
on:
  push:
    branches:
      - feature/report-share-system
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx wrangler deploy --dry-run
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q "/api/public/report-share" worker/src/index.js
          grep -q "public_shared_reports" worker/src/index.js
          grep -q "ReportShareActions" frontend/src/main.jsx
          grep -q "shared_report" frontend/src/main.jsx
          grep -q "WhatsApp" frontend/src/main.jsx
          grep -q "Messenger" frontend/src/main.jsx
          grep -q "লিংক কপি" frontend/src/main.jsx
          grep -q "PDF শেয়ার" frontend/src/main.jsx
          grep -q "public-report-share.css" frontend/src/main.jsx
